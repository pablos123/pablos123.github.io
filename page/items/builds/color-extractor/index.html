<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/png" href="/shared/icon.png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f4efe4">
  <title>color extractor</title>
  <script>
    document.documentElement.dataset.theme =
      localStorage.getItem('color-extractor-theme') === 'dark' ? 'dark' : 'light';
  </script>
  <style>
    :root {
      --paper:   #f4efe4;
      --paper2:  #eae3d4;
      --ink:     #1a1a18;
      --muted:   #7d7568;
      --shadow:  #1a1a18;
      --shade:   26, 26, 24;
      --red:     #d6342a;
      --blue:    #6d9dff;
      --yellow:  #f2c217;
      --green:   #2e7d50;
      --accent2: var(--yellow);
    }
    :root[data-theme="dark"] {
      --paper:   #1c1c1a;
      --paper2:  #292925;
      --ink:     #f4efe4;
      --muted:   #9d9587;
      --shadow:  #000000;
      --shade:   0, 0, 0;
      --red:     #f0574a;
      --blue:    #1f4fa3;
      --yellow:  #ffd54a;
      --green:   #63ce92;
      --accent2: var(--blue);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* no text selection anywhere except editable fields */
    body {
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
    }
    textarea,
    .pin-name {
      -webkit-user-select: text;
      user-select: text;
    }

    html { -webkit-text-size-adjust: 100%; }

    body {
      background: var(--paper);
      color: var(--ink);
      font-family: Futura, 'Avenir Next', 'Century Gothic', 'Helvetica Neue', Arial, sans-serif;
      height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      -webkit-tap-highlight-color: transparent;
    }

    /* ── Masthead: a little poster at the top of the page ─────────────────── */
    .masthead {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 18px;
      padding: 13px 22px 11px;
      background: var(--paper);
      border-bottom: 3px solid var(--ink);
    }
    .masthead-copy { min-width: 0; }
    .title {
      font-size: clamp(22px, 3.2vw, 38px);
      line-height: 0.95;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: -0.04em;
      white-space: nowrap;
    }
    .subtitle {
      margin-top: 6px;
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.13em;
      color: var(--muted);
    }
    .subtitle::before {
      content: '';
      display: inline-block;
      width: 7px;
      height: 7px;
      margin-right: 8px;
      background: var(--red);
      vertical-align: 1px;
    }

    #theme-btn {
      margin-left: auto;
      flex-shrink: 0;
      padding: 7px 12px;
      background: var(--paper);
      color: var(--ink);
      border: 2px solid var(--ink);
      box-shadow: 3px 3px 0 var(--shadow);
      font-family: inherit;
      font-size: 10px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.14em;
      cursor: pointer;
    }

    /* ── Panels ───────────────────────────────────────────────────────────── */
    .panes {
      display: flex;
      flex: 1;
      overflow: hidden;
    }
    .left {
      flex: 0 0 58%;
      min-width: 0;
      display: flex;
      flex-direction: column;
      border-right: 3px solid var(--ink);
    }
    .right {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .panel-head {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 15px;
      background: var(--paper2);
      border-bottom: 2px solid var(--ink);
    }
    .panel-title {
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.15em;
    }

    textarea {
      flex: 1;
      min-height: 0;
      width: 100%;
      background: var(--paper);
      color: var(--ink);
      border: none;
      outline: none;
      resize: none;
      padding: 20px 24px;
      font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', monospace;
      font-size: 13px;
      line-height: 28px;
      caret-color: var(--red);
    }
    textarea::placeholder {
      color: var(--muted);
      opacity: 0.65;
    }

    /* Chrome ignores ::-webkit-scrollbar rules when scrollbar-width/color are
       set, so those properties are only for browsers without the pseudo-elements. */
    @supports not selector(::-webkit-scrollbar) {
      textarea,
      .palette {
        scrollbar-width: thin;
        scrollbar-color: var(--ink) var(--paper2);
      }
    }
    textarea::-webkit-scrollbar,
    .palette::-webkit-scrollbar { width: 5px; height: 5px; }
    textarea::-webkit-scrollbar-track,
    .palette::-webkit-scrollbar-track { background: var(--paper2); }
    textarea::-webkit-scrollbar-thumb,
    .palette::-webkit-scrollbar-thumb {
      background: var(--ink);
      border-width: 0;
      border-radius: 0;
      cursor: pointer;
    }
    body.dragging-scrollbar textarea::-webkit-scrollbar-thumb,
    body.dragging-scrollbar .palette::-webkit-scrollbar-thumb { cursor: grabbing; }

    /* ── Filter toggles ───────────────────────────────────────────────────── */
    .filters {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      padding: 10px 14px;
      background: var(--paper);
      border-bottom: 2px solid var(--ink);
    }
    .filter-label {
      display: inline-flex;
      align-items: center;
      padding: 6px 9px;
      background: var(--paper);
      border: 2px solid var(--ink);
      font-size: 10px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      cursor: pointer;
      user-select: none;
      transition: opacity 0.18s ease;
    }
    .filter-label:has(input:not(:checked)) { opacity: 0.4; }
    .filter-label input[type="checkbox"] {
      position: absolute;
      opacity: 0;
      width: 1px;
      height: 1px;
    }

    #pin-btn {
      margin-left: auto;
      flex-shrink: 0;
      padding: 7px 13px;
      background: var(--accent2);
      color: var(--ink);
      border: 2px solid var(--ink);
      box-shadow: 3px 3px 0 var(--shadow);
      font-family: inherit;
      font-size: 10px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.14em;
      cursor: pointer;
    }
    #pin-btn:disabled {
      background: var(--paper2);
      color: var(--muted);
      border-color: var(--muted);
      box-shadow: none;
      cursor: not-allowed;
    }
    /* No button keeps a highlighted / selected look after a click or a window switch. */
    button:focus,
    button:focus-visible,
    label:focus,
    label:focus-within,
    label:focus-visible,
    input:focus,
    input:focus-visible {
      outline: none;
    }

    /* ── Palette ──────────────────────────────────────────────────────────── */
    .palette {
      flex: 1;
      overflow-y: auto;
      padding: 18px;
      background-color: var(--paper);
      background-image: radial-gradient(rgba(var(--shade), 0.1) 1px, transparent 1px);
      background-size: 16px 16px;
    }

    .swatches,
    .pin-swatches {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }
    @keyframes swatch-in {
      from { opacity: 0; }
      to   { opacity: 1; }
    }
    @keyframes swatch-out {
      from { opacity: 1; }
      to   { opacity: 0; }
    }
    .swatch-wrap { position: relative; }
    .swatch-wrap.fresh { animation: swatch-in 220ms ease-out both; }
    .swatch-wrap.fading {
      animation: swatch-out 200ms ease-in both;
      pointer-events: none;
    }
    @media (prefers-reduced-motion: reduce) {
      .swatch-wrap.fresh,
      .swatch-wrap.fading { animation: none; }
    }
    .swatch {
      width: 46px;
      height: 46px;
      border: 2px solid var(--ink);
      box-shadow: 3px 3px 0 var(--shadow);
      transition: transform 0.12s ease, box-shadow 0.12s ease;
    }
    .swatch-wrap:hover .swatch {
      transform: translate(-2px, -2px) rotate(-3deg);
      box-shadow: 5px 5px 0 var(--shadow);
      z-index: 10;
      position: relative;
    }
    @media (hover: none) {
      .swatch-wrap:hover .swatch {
        transform: none;
        box-shadow: 3px 3px 0 var(--shadow);
        z-index: auto;
      }
    }

    .empty {
      display: inline-block;
      padding: 12px 14px;
      border: 2px dashed var(--ink);
      color: var(--muted);
      font-size: 10px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.13em;
    }

    /* ── Hover tooltip ────────────────────────────────────────────────────── */
    #tooltip {
      display: none;
      position: fixed;
      min-width: 210px;
      background: var(--paper);
      border: 3px solid var(--ink);
      box-shadow: 6px 6px 0 var(--shadow);
      padding: 0;
      font-size: 11px;
      z-index: 1000;
      pointer-events: auto;
    }
    #tooltip .orig {
      display: block;
      padding: 8px 10px;
      background: var(--ink);
      color: var(--paper);
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      word-break: break-all;
    }
    #tooltip .copy-row {
      display: block;
      width: 100%;
      text-align: left;
      background: none;
      border: none;
      border-top: 1px solid rgba(var(--shade), 0.25);
      font: inherit;
      color: var(--ink);
      cursor: pointer;
      padding: 6px 10px;
    }
    #tooltip .copy-row:hover {
      background: var(--paper2);
      color: var(--ink);
    }
    #tooltip .copy-row.copied { color: var(--green); }
    #tooltip .rlbl {
      color: var(--red);
      font-size: 9px;
      font-weight: 800;
      letter-spacing: 0.12em;
      margin-right: 8px;
    }

    /* ── Bottom sheet (touch copy) ───────────────────────────────────────── */
    #sheet-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(var(--shade), 0.55);
      z-index: 1500;
    }
    #sheet-backdrop.open { display: block; }

    #sheet {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      background: var(--paper);
      border-top: 3px solid var(--ink);
      padding: 18px 16px calc(18px + env(safe-area-inset-bottom));
      z-index: 1600;
      transform: translateY(110%);
      transition: transform 0.22s ease;
      box-shadow: 0 -8px 0 rgba(var(--shade), 0.12);
    }
    #sheet.open { transform: translateY(0); }

    .sheet-head {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 14px;
    }
    .sheet-close {
      margin-left: auto;
      align-self: flex-start;
      background: var(--paper);
      border: 2px solid var(--ink);
      color: var(--ink);
      font-size: 20px;
      line-height: 1;
      width: 34px;
      height: 34px;
      cursor: pointer;
      font-family: inherit;
    }
    .sheet-preview {
      width: 44px;
      height: 44px;
      flex-shrink: 0;
      border: 2px solid var(--ink);
      box-shadow: 3px 3px 0 var(--shadow);
    }
    .sheet-orig {
      font-size: 13px;
      color: var(--ink);
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      word-break: break-all;
    }

    .sheet-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      width: 100%;
      min-height: 48px;
      background: var(--paper);
      border: 2px solid var(--ink);
      box-shadow: 3px 3px 0 var(--shadow);
      color: var(--ink);
      font: inherit;
      font-size: 13px;
      padding: 0 14px;
      margin-bottom: 10px;
      cursor: pointer;
      text-align: left;
      transition: transform 0.1s ease, box-shadow 0.1s ease;
    }
    .sheet-row .lbl {
      color: var(--red);
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.14em;
    }
    .sheet-row .val {
      font-family: 'JetBrains Mono', 'Fira Code', monospace;
      word-break: break-all;
    }
    .sheet-row.copied {
      background: var(--paper2);
      transform: translate(3px, 3px);
      box-shadow: none;
    }
    .sheet-row.copied { border-color: var(--green); }
    .sheet-row.copied .lbl { color: var(--green); }

    .sheet-hint {
      text-align: center;
      color: var(--muted);
      font-size: 9px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.16em;
      margin-top: 4px;
    }

    /* ── Toast ───────────────────────────────────────────────────────────── */
    #toast {
      position: fixed;
      left: 50%;
      bottom: 24px;
      transform: translate(-50%, 20px);
      background: var(--ink);
      color: var(--paper);
      border-left: 5px solid var(--yellow);
      font-size: 12px;
      padding: 9px 14px;
      box-shadow: 4px 4px 0 rgba(var(--shade), 0.25);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.18s ease, transform 0.18s ease;
      z-index: 2000;
    }
    #toast.show {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    /* ── Pinned groups ───────────────────────────────────────────────────── */
    .pin-divider {
      position: relative;
      height: 0;
      border-top: 3px solid var(--ink);
      margin: 18px 0 12px;
    }
    .pin-divider::before {
      content: '';
      position: absolute;
      left: 0;
      top: -5px;
      width: 8px;
      height: 8px;
      background: var(--red);
    }
    .pin-header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
    }
    .pin-name {
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.13em;
      color: var(--ink);
      flex: 1;
      outline: none;
      cursor: text;
      white-space: nowrap;
      overflow: hidden;
    }
    .pin-name:focus { box-shadow: 0 0 0 2px var(--blue); }
    .pin-remove {
      width: 24px;
      height: 24px;
      background: var(--paper);
      border: 2px solid var(--ink);
      color: var(--ink);
      cursor: pointer;
      font-size: 15px;
      line-height: 1;
      font-family: inherit;
    }

    /* ── Colophon ────────────────────────────────────────────────────────── */
    .colophon {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 6px 20px;
      background: var(--paper2);
      border-top: 3px solid var(--ink);
      font-size: 9px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.18em;
    }
    .colophon .motifs {
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }
    .colophon .motifs i { width: 8px; height: 8px; }
    .colophon .motifs i:nth-child(1) { background: var(--red); }
    .colophon .motifs i:nth-child(2) { background: var(--accent2); }
    .colophon span:last-child { margin-left: auto; color: var(--muted); }

    /* ── Responsive ──────────────────────────────────────────────────────── */
    @media (max-width: 768px) {
      .masthead { padding: 10px 14px; }
      .title { font-size: clamp(18px, 5.5vw, 26px); }
      .subtitle { font-size: 9px; letter-spacing: 0.08em; }

      .panes { flex-direction: column; }
      .left {
        flex: 0 0 40vh;
        border-right: none;
        border-bottom: 3px solid var(--ink);
      }
      .panel-head { padding: 7px 12px; }
      .filters {
        flex-wrap: nowrap;
        overflow-x: auto;
        gap: 7px;
        -webkit-overflow-scrolling: touch;
        scrollbar-width: none;
      }
      .filters::-webkit-scrollbar { display: none; }
      .filter-label { white-space: nowrap; flex-shrink: 0; }
      .palette { padding: 14px; }
      .swatch { width: 44px; height: 44px; }
      .swatches,
      .pin-swatches { gap: 8px; }
      .colophon { padding: 5px 12px; font-size: 8px; letter-spacing: 0.12em; }
    }
  </style>
</head>
<body>
  <header class="masthead">
    <div class="masthead-copy">
      <h1 class="title">color extractor</h1>
      <p class="subtitle">paste anything with colors &mdash; pull the palette</p>
    </div>
    <button id="theme-btn" type="button" title="switch theme">dark</button>
  </header>
  <div class="panes">
    <section class="left">
      <div class="panel-head">
        <span class="panel-title">the source</span>
      </div>
      <textarea id="source" placeholder="paste CSS, code, anything with colors&hellip;" spellcheck="false"></textarea>
    </section>
    <section class="right">
      <div class="panel-head">
        <span class="panel-title">the palette</span>
      </div>
      <div class="filters">
        <label class="filter-label"><input type="checkbox" id="f-hex" checked>hex</label>
        <label class="filter-label"><input type="checkbox" id="f-rgb" checked>rgb/rgba</label>
        <label class="filter-label"><input type="checkbox" id="f-hsl" checked>hsl/hsla</label>
        <label class="filter-label"><input type="checkbox" id="f-named" checked>named</label>
        <button id="pin-btn" title="save these colors as a palette" disabled>pin</button>
      </div>
      <div class="palette">
        <div class="swatches" id="swatches"></div>
      </div>
    </section>
  </div>
  <div id="tooltip"></div>

  <div id="sheet-backdrop"></div>
  <div id="sheet">
    <div class="sheet-head">
      <div class="sheet-preview" id="sheet-preview"></div>
      <div class="sheet-orig" id="sheet-orig"></div>
      <button class="sheet-close" id="sheet-close" aria-label="close">&times;</button>
    </div>
    <button class="sheet-row" id="sheet-hex"><span class="lbl">HEX</span><span class="val"></span></button>
    <button class="sheet-row" id="sheet-rgb"><span class="lbl">RGB</span><span class="val"></span></button>
    <button class="sheet-row" id="sheet-hsl"><span class="lbl">HSL</span><span class="val"></span></button>
    <div class="sheet-hint">tap a row to copy</div>
  </div>

  <div id="toast"></div>

  <footer class="colophon" aria-hidden="true">
    <span class="motifs"><i></i><i></i></span>
    <span>a little color machine</span>
  </footer>

  <script>
    // ─── Conversion utilities ───────────────────────────────────────────────────

    function hexToRgb(hex) {
      hex = hex.replace(/^#/, '');
      if (hex.length === 3 || hex.length === 4)
        hex = hex.split('').map(c => c + c).join('');
      return {
        r: parseInt(hex.slice(0, 2), 16),
        g: parseInt(hex.slice(2, 4), 16),
        b: parseInt(hex.slice(4, 6), 16),
      };
    }

    function rgbToHsl(r, g, b) {
      r /= 255; g /= 255; b /= 255;
      const max = Math.max(r, g, b), min = Math.min(r, g, b);
      let h = 0, s = 0;
      const l = (max + min) / 2;
      if (max !== min) {
        const d = max - min;
        s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
        switch (max) {
          case r: h = ((g - b) / d + (g < b ? 6 : 0)) / 6; break;
          case g: h = ((b - r) / d + 2) / 6; break;
          case b: h = ((r - g) / d + 4) / 6; break;
        }
      }
      return { h: Math.round(h * 360), s: Math.round(s * 100), l: Math.round(l * 100) };
    }

    function hslToRgb(h, s, l) {
      s /= 100; l /= 100;
      const k = n => (n + h / 30) % 12;
      const a = s * Math.min(l, 1 - l);
      const f = n => Math.round((l - a * Math.max(-1, Math.min(k(n) - 3, Math.min(9 - k(n), 1)))) * 255);
      return { r: f(0), g: f(8), b: f(4) };
    }

    function normalizeHex(r, g, b) {
      return '#' + [r, g, b].map(v => Math.max(0, Math.min(255, Math.round(v))).toString(16).padStart(2, '0')).join('');
    }

    function fmtRgb(r, g, b)   { return `rgb(${r}, ${g}, ${b})`; }
    function fmtHsl(h, s, l)   { return `hsl(${h}, ${s}%, ${l}%)`; }

    function escHtml(s) {
      return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    // ─── Named CSS colors ────────────────────────────────────────────────────────

    const NAMED = {
      aliceblue:'#f0f8ff',antiquewhite:'#faebd7',aqua:'#00ffff',aquamarine:'#7fffd4',
      azure:'#f0ffff',beige:'#f5f5dc',bisque:'#ffe4c4',black:'#000000',
      blanchedalmond:'#ffebcd',blue:'#0000ff',blueviolet:'#8a2be2',brown:'#a52a2a',
      burlywood:'#deb887',cadetblue:'#5f9ea0',chartreuse:'#7fff00',chocolate:'#d2691e',
      coral:'#ff7f50',cornflowerblue:'#6495ed',cornsilk:'#fff8dc',crimson:'#dc143c',
      cyan:'#00ffff',darkblue:'#00008b',darkcyan:'#008b8b',darkgoldenrod:'#b8860b',
      darkgray:'#a9a9a9',darkgreen:'#006400',darkgrey:'#a9a9a9',darkkhaki:'#bdb76b',
      darkmagenta:'#8b008b',darkolivegreen:'#556b2f',darkorange:'#ff8c00',
      darkorchid:'#9932cc',darkred:'#8b0000',darksalmon:'#e9967a',darkseagreen:'#8fbc8f',
      darkslateblue:'#483d8b',darkslategray:'#2f4f4f',darkslategrey:'#2f4f4f',
      darkturquoise:'#00ced1',darkviolet:'#9400d3',deeppink:'#ff1493',
      deepskyblue:'#00bfff',dimgray:'#696969',dimgrey:'#696969',dodgerblue:'#1e90ff',
      firebrick:'#b22222',floralwhite:'#fffaf0',forestgreen:'#228b22',fuchsia:'#ff00ff',
      gainsboro:'#dcdcdc',ghostwhite:'#f8f8ff',gold:'#ffd700',goldenrod:'#daa520',
      gray:'#808080',green:'#008000',greenyellow:'#adff2f',grey:'#808080',
      honeydew:'#f0fff0',hotpink:'#ff69b4',indianred:'#cd5c5c',indigo:'#4b0082',
      ivory:'#fffff0',khaki:'#f0e68c',lavender:'#e6e6fa',lavenderblush:'#fff0f5',
      lawngreen:'#7cfc00',lemonchiffon:'#fffacd',lightblue:'#add8e6',lightcoral:'#f08080',
      lightcyan:'#e0ffff',lightgoldenrodyellow:'#fafad2',lightgray:'#d3d3d3',
      lightgreen:'#90ee90',lightgrey:'#d3d3d3',lightpink:'#ffb6c1',lightsalmon:'#ffa07a',
      lightseagreen:'#20b2aa',lightskyblue:'#87ceeb',lightslategray:'#778899',
      lightslategrey:'#778899',lightsteelblue:'#b0c4de',lightyellow:'#ffffe0',
      lime:'#00ff00',limegreen:'#32cd32',linen:'#faf0e6',magenta:'#ff00ff',
      maroon:'#800000',mediumaquamarine:'#66cdaa',mediumblue:'#0000cd',
      mediumorchid:'#ba55d3',mediumpurple:'#9370db',mediumseagreen:'#3cb371',
      mediumslateblue:'#7b68ee',mediumspringgreen:'#00fa9a',mediumturquoise:'#48d1cc',
      mediumvioletred:'#c71585',midnightblue:'#191970',mintcream:'#f5fffa',
      mistyrose:'#ffe4e1',moccasin:'#ffe4b5',navajowhite:'#ffdead',navy:'#000080',
      oldlace:'#fdf5e6',olive:'#808000',olivedrab:'#6b8e23',orange:'#ffa500',
      orangered:'#ff4500',orchid:'#da70d6',palegoldenrod:'#eee8aa',palegreen:'#98fb98',
      paleturquoise:'#afeeee',palevioletred:'#db7093',papayawhip:'#ffefd5',
      peachpuff:'#ffdab9',peru:'#cd853f',pink:'#ffc0cb',plum:'#dda0dd',
      powderblue:'#b0e0e6',purple:'#800080',rebeccapurple:'#663399',red:'#ff0000',
      rosybrown:'#bc8f8f',royalblue:'#4169e1',saddlebrown:'#8b4513',salmon:'#fa8072',
      sandybrown:'#f4a460',seagreen:'#2e8b57',seashell:'#fff5ee',sienna:'#a0522d',
      silver:'#c0c0c0',skyblue:'#87ceeb',slateblue:'#6a5acd',slategray:'#708090',
      slategrey:'#708090',snow:'#fffafa',springgreen:'#00ff7f',steelblue:'#4682b4',
      tan:'#d2b48c',teal:'#008080',thistle:'#d8bfd8',tomato:'#ff6347',
      turquoise:'#40e0d0',violet:'#ee82ee',wheat:'#f5deb3',white:'#ffffff',
      whitesmoke:'#f5f5f5',yellow:'#ffff00',yellowgreen:'#9acd32',
    };

    // ─── Parser ──────────────────────────────────────────────────────────────────

    const RE = {
      hex:   /#(?:[0-9a-fA-F]{8}|[0-9a-fA-F]{6}|[0-9a-fA-F]{4}|[0-9a-fA-F]{3})(?![0-9a-fA-F])/g,
      rgb:   /rgba?\(\s*\d{1,3}\s*,\s*\d{1,3}\s*,\s*\d{1,3}\s*(?:,\s*[\d.]+\s*)?\)/gi,
      hsl:   /hsla?\(\s*[\d.]+\s*,\s*[\d.]+%\s*,\s*[\d.]+%\s*(?:,\s*[\d.]+\s*)?\)/gi,
    };

    function parseColors(text, filters) {
      const seen  = new Set();
      const hits  = [];

      function push(original, r, g, b, type) {
        const hex = normalizeHex(r, g, b);
        if (seen.has(hex)) return;
        seen.add(hex);
        const hsl = rgbToHsl(r, g, b);
        hits.push({ original, type, hex, rgb: fmtRgb(r,g,b), hsl: fmtHsl(hsl.h,hsl.s,hsl.l) });
      }

      // Collect all matches with their text position so we can sort by appearance
      const raw = [];

      if (filters.hex) {
        for (const m of text.matchAll(new RegExp(RE.hex.source, 'g')))
          raw.push({ type: 'hex', str: m[0], idx: m.index });
      }
      if (filters.rgb) {
        for (const m of text.matchAll(new RegExp(RE.rgb.source, 'gi')))
          raw.push({ type: 'rgb', str: m[0], idx: m.index });
      }
      if (filters.hsl) {
        for (const m of text.matchAll(new RegExp(RE.hsl.source, 'gi')))
          raw.push({ type: 'hsl', str: m[0], idx: m.index });
      }
      if (filters.named) {
        const namedRe = new RegExp(`\\b(${Object.keys(NAMED).join('|')})\\b`, 'gi');
        for (const m of text.matchAll(namedRe))
          raw.push({ type: 'named', str: m[0].toLowerCase(), idx: m.index });
      }

      raw.sort((a, b) => a.idx - b.idx);

      for (const { type, str } of raw) {
        try {
          if (type === 'hex') {
            const { r, g, b } = hexToRgb(str);
            push(str, r, g, b, type);
          } else if (type === 'rgb') {
            const n = str.match(/[\d.]+/g);
            const r = Math.min(255, Math.round(+n[0]));
            const g = Math.min(255, Math.round(+n[1]));
            const b = Math.min(255, Math.round(+n[2]));
            push(str, r, g, b, type);
          } else if (type === 'hsl') {
            const n = str.match(/[\d.]+/g);
            const { r, g, b } = hslToRgb(+n[0], +n[1], +n[2]);
            push(str, r, g, b, type);
          } else if (type === 'named') {
            const { r, g, b } = hexToRgb(NAMED[str]);
            push(str, r, g, b, type);
          }
        } catch (_) { /* skip malformed */ }
      }

      return hits;
    }

    // ─── Render ──────────────────────────────────────────────────────────────────

    const tip = document.getElementById('tooltip');
    let hideTimer = null;

    function copyRow(btn) {
      const value = btn.dataset.copy;
      const done = () => {
        btn.classList.add('copied');
        setTimeout(() => btn.classList.remove('copied'), 900);
      };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(value).then(done).catch(() => fallbackCopy(value, done));
      } else {
        fallbackCopy(value, done);
      }
    }

    function fallbackCopy(value, done) {
      const ta = document.createElement('textarea');
      ta.value = value;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand('copy'); done(); } catch (_) {}
      document.body.removeChild(ta);
    }

    function populateTip(w) {
      const row = (lbl, v) => `<button class="copy-row" data-copy="${escHtml(v)}"><span class="rlbl">${lbl}</span>${escHtml(v)}</button>`;
      tip.innerHTML =
        `<span class="orig">${escHtml(w.dataset.orig)}</span>` +
        row('HEX', w.dataset.hex) +
        row('RGB', w.dataset.rgb) +
        row('HSL', w.dataset.hsl);
    }

    function cancelHide() { if (hideTimer) { clearTimeout(hideTimer); hideTimer = null; } }
    function scheduleHide() { cancelHide(); hideTimer = setTimeout(hideTip, 220); }

    tip.addEventListener('mouseenter', cancelHide);
    tip.addEventListener('mouseleave', scheduleHide);
    tip.addEventListener('click', e => {
      const btn = e.target.closest('.copy-row');
      if (btn) copyRow(btn);
    });

    function showTip(e) {
      const w = e.currentTarget;
      cancelHide();
      populateTip(w);
      tip.style.display = 'block';
      moveTip(e);
    }

    function moveTip(e) {
      const r = e.currentTarget.getBoundingClientRect();
      const tw = tip.offsetWidth;
      let left = r.left + r.width / 2 - tw / 2;
      let top  = r.top - tip.offsetHeight - 8;
      // If tooltip would go above viewport, show below
      if (top < 4) top = r.bottom + 8;
      // Clamp horizontally within viewport
      left = Math.max(4, Math.min(left, window.innerWidth - tw - 4));
      tip.style.left = left + 'px';
      tip.style.top  = top  + 'px';
    }

    function hideTip() {
      tip.style.display = 'none';
    }

    // ─── Toast ─────────────────────────────────────────────────────────────────

    const toast = document.getElementById('toast');
    let toastTimer = null;
    function showToast(msg) {
      toast.textContent = msg;
      toast.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.remove('show'), 1100);
    }

    // ─── Bottom sheet (touch copy) ───────────────────────────────────────────────

    const isTouch  = 'ontouchstart' in window || navigator.maxTouchPoints > 0;
    const sheet    = document.getElementById('sheet');
    const backdrop = document.getElementById('sheet-backdrop');
    const sheetRows = {
      hex: document.getElementById('sheet-hex'),
      rgb: document.getElementById('sheet-rgb'),
      hsl: document.getElementById('sheet-hsl'),
    };

    function openSheet(w) {
      document.getElementById('sheet-orig').textContent = w.dataset.orig;
      document.getElementById('sheet-preview').style.background = w.dataset.hex;
      const fill = (row, val) => {
        row.querySelector('.val').textContent = val;
        row.dataset.copy = val;
      };
      fill(sheetRows.hex, w.dataset.hex);
      fill(sheetRows.rgb, w.dataset.rgb);
      fill(sheetRows.hsl, w.dataset.hsl);
      backdrop.classList.add('open');
      requestAnimationFrame(() => sheet.classList.add('open'));
    }

    function closeSheet() {
      sheet.classList.remove('open');
      backdrop.classList.remove('open');
    }

    backdrop.addEventListener('click', closeSheet);
    document.getElementById('sheet-close').addEventListener('click', closeSheet);

    // Scroll / swipe anywhere dismisses the sheet — a common bottom-sheet gesture. (The
    // grab-handle that *looked* draggable is gone; the gesture itself stays.)
    function closeSheetOnScroll() {
      if (sheet.classList.contains('open')) closeSheet();
    }
    backdrop.addEventListener('touchmove', closeSheetOnScroll, { passive: true });
    sheet.addEventListener('touchmove', closeSheetOnScroll, { passive: true });
    document.querySelector('.palette').addEventListener('scroll', closeSheetOnScroll, { passive: true });
    window.addEventListener('scroll', closeSheetOnScroll, { passive: true });
    window.addEventListener('wheel',  closeSheetOnScroll, { passive: true });

    Object.values(sheetRows).forEach(row => {
      row.addEventListener('click', () => {
        const value = row.dataset.copy;
        const done = () => {
          showToast('copied ' + value);
          row.classList.add('copied');
          setTimeout(() => row.classList.remove('copied'), 900);
        };
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(value).then(done).catch(() => fallbackCopy(value, done));
        } else {
          fallbackCopy(value, done);
        }
      });
    });

    function attachSwatchListener(w) {
      if (isTouch) {
        w.addEventListener('click', () => openSheet(w));
      } else {
        w.addEventListener('mouseenter', showTip);
        w.addEventListener('mousemove',  moveTip);
        w.addEventListener('mouseleave', scheduleHide);
      }
    }

    function attachSwatchListeners(container) {
      container.querySelectorAll('.swatch-wrap').forEach(attachSwatchListener);
    }

    function makeSwatch(c, animate = true) {
      const wrap = document.createElement('div');
      wrap.className = animate ? 'swatch-wrap fresh' : 'swatch-wrap';
      wrap.dataset.orig = c.original;
      wrap.dataset.hex = c.hex;
      wrap.dataset.rgb = c.rgb;
      wrap.dataset.hsl = c.hsl;
      if (animate) {
        wrap.addEventListener('animationend', () => wrap.classList.remove('fresh'), { once: true });
      }

      const swatch = document.createElement('div');
      swatch.className = 'swatch';
      swatch.style.background = c.hex;
      wrap.appendChild(swatch);
      return wrap;
    }

    function fadeOut(w) {
      w.classList.remove('fresh');
      w.classList.add('fading');
      const remove = () => w.remove();
      w.addEventListener('animationend', remove, { once: true });
      setTimeout(remove, 240); // also covers prefers-reduced-motion
    }

    function render(colors, message = 'no colors found in that text', animate = true) {
      const el = document.getElementById('swatches');
      const wasEmpty = !!el.querySelector('.empty');
      el.querySelectorAll('.empty').forEach(empty => empty.remove());
      // Drop anything already on its way out, including fades from an interrupted edit.
      el.querySelectorAll('.swatch-wrap.fading').forEach(w => w.remove());

      if (!colors.length) {
        // The empty note replaces the palette immediately. Never leave the last
        // swatches fading out underneath it.
        el.querySelectorAll('.swatch-wrap').forEach(w => w.remove());
        const empty = document.createElement('span');
        empty.className = 'empty';
        empty.textContent = message;
        el.appendChild(empty);
        return;
      }

      // Reuse swatches that are already on screen: only new colors fade in and only
      // removed colors fade out, so typing never makes the whole palette blink.
      const keep = new Set(colors.map(c => c.hex));
      const existing = new Map();
      for (const w of el.querySelectorAll('.swatch-wrap:not(.fading)')) existing.set(w.dataset.hex, w);
      for (const [hex, w] of existing) {
        if (!keep.has(hex)) { if (animate) fadeOut(w); else w.remove(); }
      }

      const used = new Set();
      colors.forEach((c, i) => {
        let wrap = existing.get(c.hex);
        if (wrap && used.has(wrap)) wrap = null;
        if (wrap) {
          used.add(wrap);
          wrap.dataset.orig = c.original;
          wrap.dataset.rgb = c.rgb;
          wrap.dataset.hsl = c.hsl;
        } else {
          // The first color after the empty note appears instantly, just like
          // the note itself. Later additions still fade in while typing.
          wrap = makeSwatch(c, animate && !wasEmpty);
          attachSwatchListener(wrap);
        }
        if (el.children[i] !== wrap) el.insertBefore(wrap, el.children[i] || null);
      });

      for (let i = el.children.length - 1; i >= colors.length; i--) {
        const child = el.children[i];
        if (!child.classList.contains('fading')) child.remove();
      }
    }

    // ─── Pin state & persistence ─────────────────────────────────────────────────

    const state = { pinned: [] };

    function savePins() {
      localStorage.setItem('color-extractor-pins', JSON.stringify(state.pinned));
    }

    function loadPins() {
      try {
        const parsed = JSON.parse(localStorage.getItem('color-extractor-pins') || '[]');
        state.pinned = Array.isArray(parsed) ? parsed : [];
      } catch (_) { state.pinned = []; }
      renderPinned();
    }

    function fmtPinName() {
      return `Palette ${state.pinned.length + 1}`;
    }

    function makePinGroup(entry) {
      const wrap = document.createElement('div');
      wrap.className = 'pin-group';
      wrap.dataset.id = entry.id;

      const divider = document.createElement('div');
      divider.className = 'pin-divider';

      const header = document.createElement('div');
      header.className = 'pin-header';

      const nameEl = document.createElement('span');
      nameEl.className = 'pin-name';
      nameEl.contentEditable = 'true';
      nameEl.textContent = entry.name;
      nameEl.spellcheck = false;
      let savedName = entry.name;
      nameEl.addEventListener('focus', () => { savedName = nameEl.textContent; });
      nameEl.addEventListener('blur', () => {
        const trimmed = nameEl.textContent.trim() || savedName;
        nameEl.textContent = trimmed;
        if (state.pinned.some(e => e.id === entry.id)) renamePin(entry.id, trimmed);
      });
      nameEl.addEventListener('keydown', e => {
        if (e.key === 'Enter')  { e.preventDefault(); nameEl.blur(); }
        if (e.key === 'Escape') { nameEl.textContent = savedName; nameEl.blur(); }
      });

      const removeBtn = document.createElement('button');
      removeBtn.className = 'pin-remove';
      removeBtn.textContent = '×';
      removeBtn.addEventListener('click', () => removePin(entry.id));

      header.appendChild(nameEl);
      header.appendChild(removeBtn);

      const swatchesEl = document.createElement('div');
      swatchesEl.className = 'pin-swatches';
      entry.colors.forEach(c => {
        const sw = makeSwatch(c);
        attachSwatchListener(sw);
        swatchesEl.appendChild(sw);
      });

      wrap.appendChild(divider);
      wrap.appendChild(header);
      wrap.appendChild(swatchesEl);
      return wrap;
    }

    function renderPinned() {
      document.querySelectorAll('.pin-group').forEach(el => el.remove());
      const palette = document.querySelector('.palette');
      // Newest palette at the top of the stack.
      state.pinned.slice().reverse().forEach(entry => palette.appendChild(makePinGroup(entry)));
    }

    function pin() {
      const text = document.getElementById('source').value;
      if (!text.trim()) return;
      const colors = parseColors(text, getFilters());
      if (!colors.length) return;
      state.pinned.push({ id: String(Date.now()), name: fmtPinName(), colors });
      savePins();
      renderPinned();
    }

    function removePin(id) {
      state.pinned = state.pinned.filter(e => e.id !== id);
      savePins();
      renderPinned();
    }

    function renamePin(id, name) {
      const entry = state.pinned.find(e => e.id === id);
      if (entry) { entry.name = name; savePins(); }
    }

    // ─── Wire up ─────────────────────────────────────────────────────────────────

    function getFilters() {
      return {
        hex:   document.getElementById('f-hex').checked,
        rgb:   document.getElementById('f-rgb').checked,
        hsl:   document.getElementById('f-hsl').checked,
        named: document.getElementById('f-named').checked,
      };
    }

    const narrow = window.matchMedia('(max-width: 768px)');
    const pinBtn = document.getElementById('pin-btn');

    function update(animate = true) {
      const text = document.getElementById('source').value;
      if (!text.trim()) {
        pinBtn.disabled = true;
        const hint = narrow.matches
          ? 'paste some text above to see its colors'
          : 'paste some text on the left to see its colors';
        render([], hint, animate);
        return;
      }
      const colors = parseColors(text, getFilters());
      pinBtn.disabled = colors.length === 0;
      render(colors, undefined, animate);
    }
    // Keep the hint in sync when the two-panel layout flips on resize / rotation.
    narrow.addEventListener('change', () => update(false));

    const src = document.getElementById('source');
    src.addEventListener('input', () => {
      localStorage.setItem('color-extractor-source', src.value);
      update();
    });
    // Filter changes swap colors instantly; the fades are only for typing.
    document.querySelectorAll('.filters input').forEach(cb =>
      cb.addEventListener('change', () => update(false)));
    pinBtn.addEventListener('click', pin);

    const themeBtn = document.getElementById('theme-btn');
    function applyTheme(theme) {
      const next = theme === 'dark' ? 'light' : 'dark';
      document.documentElement.dataset.theme = theme;
      themeBtn.textContent = next;
      themeBtn.title = 'switch to ' + next + ' theme';
      document.querySelector('meta[name="theme-color"]').content =
        theme === 'dark' ? '#1c1c1a' : '#f4efe4';
      localStorage.setItem('color-extractor-theme', theme);
    }
    themeBtn.addEventListener('click', () =>
      applyTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark'));
    applyTheme(document.documentElement.dataset.theme);

    // A tapped control must never keep a focus ring / pressed look, including
    // after switching windows or tabs and coming back.
    function clearStickyFocus() {
      const el = document.activeElement;
      if (el && el !== document.body && typeof el.blur === "function") el.blur();
    }
    window.addEventListener("blur", clearStickyFocus);
    document.addEventListener("visibilitychange", () => {
      if (document.hidden) clearStickyFocus();
    });
    document.addEventListener("pointerup", event => {
      if (event.target.closest?.("a, button, label, input[type=checkbox], input[type=range]")) {
        const active = document.activeElement;
        if (active?.matches?.("a, button, input[type=checkbox], input[type=range]"))
          setTimeout(() => active.blur(), 0);
      }
    });

    // Chrome does not expose :active on scrollbar thumbs, so detect a grab on the
    // 5px scrollbar strip and switch the cursor to a closed hand while dragging.
    const scrollbarWidth = 5;
    document.addEventListener('pointerdown', e => {
      for (const el of [document.getElementById('source'), document.querySelector('.palette')]) {
        const r = el.getBoundingClientRect();
        if (e.clientX >= r.right - scrollbarWidth && e.clientX <= r.right &&
            e.clientY >= r.top && e.clientY <= r.bottom) {
          document.body.classList.add('dragging-scrollbar');
          return;
        }
      }
    }, true);
    const endScrollbarDrag = () => document.body.classList.remove('dragging-scrollbar');
    window.addEventListener('pointerup', endScrollbarDrag);
    window.addEventListener('blur', endScrollbarDrag);

    const saved = localStorage.getItem('color-extractor-source');
    if (saved) { document.getElementById('source').value = saved; }
    update();    // initial live render
    loadPins();  // restore pinned groups from localStorage
  </script>
</body>
</html>
